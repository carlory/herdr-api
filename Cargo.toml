[package]
name = "herdr-api"
version = "0.9.3"
edition = "2021"
description = "Unofficial protocol types for the Herdr 0.9.3 JSON API"
license = "Apache-2.0"
repository = "https://github.com/carlory/herdr-api"
readme = "README.md"
include = ["src/**", "examples/**", "tests/**", "scripts/*.py", "Cargo.toml", "README.md", "EXTRACTION.md", "LICENSE", "NOTICE", "upstream.toml"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "=1.2.1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
