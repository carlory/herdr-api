name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc
      - name: Install official Herdr release (no source build)
        run: python scripts/install_herdr.py .tools
      - name: Compare official Schema and test live release
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python scripts/check_release.py .tools/herdr.exe
          else
            python scripts/check_release.py .tools/herdr
          fi
      - name: Verify crate package
        run: cargo package --locked
      - name: Upload protocol verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: ignore
