name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  agentic-workflows:
    name: Validate generated agentic workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw --pin "$(cat .github/aw-version)"
      - name: Recompile without changing generated files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh aw compile adapt-herdr --no-check-update
          git diff --exit-code -- .github/workflows/adapt-herdr.lock.yml .github/aw/actions-lock.json
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Install official Herdr release (no source build)
        run: python scripts/install_herdr.py .tools
      - name: Compare official Schema and test live release
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python scripts/check_release.py .tools/herdr.exe
          else
            python scripts/check_release.py .tools/herdr
          fi
      - name: Verify crate package
        env:
          # Keep Cargo's temporary package tree out of the dependency cache.
          CARGO_TARGET_DIR: ${{ runner.temp }}/herdr-api-package
        run: cargo package --locked
      - name: Upload protocol verification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: protocol-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: ignore
