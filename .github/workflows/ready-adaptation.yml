name: Hand off completed adaptation
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ['adapt-herdr-*']
  workflow_dispatch:
    inputs:
      pull_request:
        description: 'Completed adaptation PR to mark ready after CI'
        required: true
        type: string
permissions:
  actions: read
  contents: read
  pull-requests: read
jobs:
  ready:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - env:
          GH_TOKEN: ${{ github.token }}
          MERGE_TOKEN: ${{ secrets.GH_AW_CI_TRIGGER_TOKEN }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          REQUESTED_PR: ${{ inputs.pull_request }}
        run: python scripts/ready_adaptation.py
