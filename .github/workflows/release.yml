name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Candidate tag to validate (dry run only, no tag is created)'
        required: true
        default: 'v0.9.3'
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate release identity and main ancestry
        id: version
        env:
          CANDIDATE_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            python scripts/release.py check --tag "$GITHUB_REF_NAME" --require-tag
          else
            python scripts/release.py check --tag "$CANDIDATE_TAG"
          fi
          git merge-base --is-ancestor HEAD origin/main

  verify:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  candidate:
    needs: [preflight, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: protocol-ubuntu-latest
          path: artifacts/
      - name: Rehearse crates.io publication without uploading
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/herdr-api-package
        run: cargo publish --locked --dry-run
      - name: Prepare package, schemas, provenance, notes, and checksums
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          PACKAGE_DIR: ${{ runner.temp }}/herdr-api-package/package
        run: python scripts/release.py prepare --tag "$RELEASE_TAG" --package-dir "$PACKAGE_DIR"
      - name: Check registry availability and retry identity
        run: python scripts/release.py registry --dist dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Summarize candidate
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          echo "Validated $RELEASE_TAG at $GITHUB_SHA on all three platforms." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo 'Dry run complete. No tag, registry upload, or GitHub Release was created.' >> "$GITHUB_STEP_SUMMARY"
          fi

  crates-io:
    if: github.event_name == 'push' && github.repository == 'carlory/herdr-api'
    needs: candidate
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: dist/
      - name: Confirm the remote tag still identifies the reviewed commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py guard --dist dist
      - name: Rebuild and match the reviewed candidate
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/herdr-api-package
        run: |
          cargo package --locked
          python scripts/release.py match-package --dist dist --package-dir "$CARGO_TARGET_DIR/package"
      - name: Inspect existing registry version
        id: registry
        run: python scripts/release.py registry --dist dist
      - name: Publish a new version
        if: steps.registry.outputs.exists != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/herdr-api-package
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo 'Configure CARGO_REGISTRY_TOKEN in the crates-io environment before releasing.' >&2
            exit 1
          fi
          cargo publish --locked
      - name: Confirm the registry serves the exact candidate
        run: python scripts/release.py registry --dist dist --wait 180

  github-release:
    needs: crates-io
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: dist/
      - name: Complete GitHub Release after successful registry publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py github --dist dist
